<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 244" role="img" aria-labelledby="title desc">
  <title id="title">Follow the evidence.</title>
  <desc id="desc">A mint signal follows a selected path through a graph of connected passages.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#344746"/></pattern>
    <linearGradient id="bg"><stop stop-color="#101e22"/><stop offset="1" stop-color="#182e32"/></linearGradient>
  </defs>
  <style>
    .signal { stroke-dasharray: 14 390; animation: travel 5s linear infinite; }
    @keyframes travel { from { stroke-dashoffset: 14; } to { stroke-dashoffset: -390; } }
    @media (prefers-reduced-motion: reduce) { .signal { animation: none; } }
  </style>
  <rect width="960" height="244" rx="18" fill="url(#bg)"/>
  <rect width="960" height="244" rx="18" fill="url(#grid)"/>
  <g font-family="ui-monospace,monospace" font-size="16" letter-spacing="2" fill="#98ead1">
    <text x="42" y="60">AION7891 / RETRIEVAL LAB</text>
  </g>
  <text x="40" y="139" font-family="Georgia,serif" font-size="63" fill="#fff7dc">Follow the evidence.</text>
  <text x="44" y="190" font-family="system-ui,sans-serif" font-size="20" fill="#bbd2cf">Graph retrieval · Local RAG · Agent memory</text>
  <g fill="none" stroke="#496b70" stroke-width="2">
    <path d="M608 134 674 48 753 94 804 36 917 108 864 191 755 201 678 159 608 134 M674 48 678 159 753 94 755 201 M804 36 864 191"/>
    <path id="route" d="m608 134 70 25 75-65 111 97 53-83" stroke="#63bba9"/>
    <path class="signal" d="m608 134 70 25 75-65 111 97 53-83" pathLength="390" stroke="#fff3ad" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g fill="#233e43" stroke="#7b9898" stroke-width="2"><circle cx="674" cy="48" r="6"/><circle cx="804" cy="36" r="6"/><circle cx="755" cy="201" r="6"/></g>
  <g fill="#93e8ce" stroke="#132c30" stroke-width="3"><circle cx="608" cy="134" r="8"/><circle cx="678" cy="159" r="8"/><circle cx="753" cy="94" r="8"/><circle cx="864" cy="191" r="8"/><circle cx="917" cy="108" r="10" fill="#ffdd8f"/></g>
</svg>
